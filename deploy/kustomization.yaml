apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy NVIDIA Triton Inference Server as the shared, multi-model GPU backend.
# Render/apply with:
#   kubectl apply -k deploy/
# or preview:
#   kubectl kustomize deploy/
#
# This base has NO CRD dependencies, so it applies on any cluster. Prometheus
# scraping (a ServiceMonitor) requires the Prometheus Operator CRDs and is
# therefore opt-in: after those CRDs are installed, ALSO apply the monitoring
# overlay (`kubectl apply -k deploy/monitoring/`) to add the ServiceMonitor.
#
# Models load declaratively: the deployment's load-models initContainer copies
# them from the versioned models image (ghcr.io/uug-ai/triton-models) into an
# emptyDir. Pin/roll the model set with the `images:` tag below — no PVC and no
# manual copy step. (pvc.yaml stays in the repo as an alternative but is not
# applied by default.)

namespace: triton

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

# Pin the model bundle version here (GitOps-friendly).
images:
  - name: ghcr.io/uug-ai/triton-models
    newTag: latest
