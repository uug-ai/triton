apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy NVIDIA Triton Inference Server as the shared, multi-model GPU backend.
# Render/apply with:
#   kubectl apply -k deploy/
# or preview:
#   kubectl kustomize deploy/

namespace: triton

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - hpa.yaml
