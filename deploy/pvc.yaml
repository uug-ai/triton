# OPTIONAL — not applied by the base kustomization. The default deployment loads
# models from the versioned models image via an initContainer into an emptyDir
# (see deployment.yaml / kustomization.yaml), so no PVC is required. Keep this
# only if you prefer a persistent, externally-populated model repository: add it
# back to kustomization.yaml resources and swap the deployment's emptyDir +
# initContainer for this claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triton-model-repository
  namespace: triton
  labels:
    app: triton
spec:
  # ReadWriteOnce works for a single Triton replica. To scale to multiple
  # replicas (see hpa.yaml) either use a ReadWriteMany storage class so every
  # pod can mount the repository read-only, or load models from S3/MinIO instead
  # of a PVC (see deployment.yaml).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Set to your cluster's storage class (the Kerberos stack ships `ssd-hostpath`).
  # storageClassName: ssd-hostpath
