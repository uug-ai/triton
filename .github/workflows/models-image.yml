name: Build models image

# Builds and pushes the Triton model-bundle image
# (ghcr.io/<owner>/triton-models): the model repository (config.pbtxt + ONNX
# weights exported at build time). The deploy/ initContainer pulls this image to
# populate Triton's model repository, so rolling out new models is just bumping
# this image's tag in deploy/kustomization.yaml.
on:
  push:
    branches: [main]
    paths:
      - "model-repository/**"
      - "models/**"
      - "Dockerfile.models"
      - ".github/workflows/models-image.yml"
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/triton-models
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.models
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
