name: Create a new release
on:
  release:
    types: [created]

jobs:
  release:
    uses: uug-ai/workflows/.github/workflows/release-create.yml@main
    with:
      organization: uug-ai
      project: ${{ github.event.repository.name }}
      tag: ${{ github.event.release.tag_name }}
      docker_context: "."
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-24.04"},
          {"architecture":"arm64","runner":"ubuntu-24.04-arm"}
        ]
      # Build + publish the multi-arch image/manifests to GHCR, but do NOT open a
      # GitOps bump PR yet: triton is not deployed via uug-ai/gitops (no
      # services.triton values, and it is not in promote.yaml's tag_path
      # allow-list). Once it is wired into gitops, set this to true and add
      # `gitops_key: kerberoshub.services.triton.tag`.
      create_gitops_pr: false
    secrets: inherit
