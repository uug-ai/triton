name: Test Coverage
on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [created]
  push:
    branches:
      - main

jobs:
  test-coverage:
    uses: uug-ai/workflows/.github/workflows/test-coverage.yaml@main
    with:
      organization: uug-ai
      project: ${{ github.event.repository.name }}
      go_version: "1.25.8"
      # The repo's Go module is the client SDK under clients/go. It is stdlib-only
      # (no go.sum), so use go.mod as the dependency-cache key.
      go_dir: "clients/go"
      go_sum_path: "clients/go/go.mod"
      coverage_artifact_name: coverage-report
    secrets: inherit
